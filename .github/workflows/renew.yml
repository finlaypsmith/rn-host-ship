name: Host-Ship Auto Renew

on:
  workflow_dispatch:

  schedule:
    # 每天北京时间 08:00 自动检查
    # GitHub cron 使用 UTC
    # UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"

jobs:
  renew:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests "requests[socks]"
          python -m playwright install --with-deps chromium

      - name: ⚙ 设置代理 (自动选择 sing-box / Xray)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://gist.githubusercontent.com/janver/c5dcc485bb25a43568cb33ac3cb49efd/raw/setup_p.sh)

      - name: Run renew
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          HOSTSHIP_LOGIN: ${{ secrets.HOSTSHIP_LOGIN }}
          HOSTSHIP_PASSWORD: ${{ secrets.HOSTSHIP_PASSWORD }}

          # 可选：已登录会话 cookie，优先复用登录态，失效时回退账号密码
          SESSION_COOKIES: ${{ secrets.SESSION_COOKIES }}

          # 可选：具备 repo 权限的 GitHub Token，用于登录成功后回写 SESSION_COOKIES
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}

          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}

        run: python hostship_renew.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hostship-debug-screenshots
          path: |
            hostship_*.png
          if-no-files-found: ignore

      - name: Cleanup proxy
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f 'xray run' || true
          rm -f sing-box sing-box-config.json sing-box.log
          rm -f xray xray-config.json xray.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done